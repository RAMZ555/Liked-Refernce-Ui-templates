<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Viewed — Email • v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #16233f;
    --text: #313d52;
    --muted: #6b7688;
    --faint: #98a2b3;
    --border: #e4e7ee;
    --navy: #12275c;
    --amber: #ff9900;
    --amber-dark: #ec8b00;
    --bg: #eef0f4;
    --chip-bg: #fff3e0;
    /* "Viewed" accent — neutral slate, distinct from navy/blue/green */
    --slate: #5b6478;
    --slate-bg: #f2f4f8;
    --slate-border: #d6dbe5;
    --slate-ink: #2f3a4a;
  }

  body {
    font-family: 'Inter', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .mail {
    width: 100%;
    max-width: 660px;
    border-radius: 0;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(15,23,42,0.05), 0 24px 48px -18px rgba(15,23,42,0.18);
  }

  /* ── Header (slate — "Viewed" variant) ── */
  .mail__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 28px;
    background: linear-gradient(120deg, #353b4a 0%, #5b6478 100%);
  }

  .mail__brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

  .mail__logo { height: 46px; max-width: 200px; object-fit: contain; }

  .mail__brand-title { color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; }

  .mail__header-side {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.16);
    white-space: nowrap;
  }

  .mail__pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }

  .mail__header-side span { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: rgba(255,255,255,0.85); text-transform: uppercase; }

  /* ── Body ── */
  .mail__body { background: #fff; padding: 28px 28px 8px; }

  /* headline */
  .headline { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }

  .headline__icon {
    flex: 0 0 auto; width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--slate-bg); border: 1px solid var(--slate-border);
  }

  .headline__title { font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }

  .headline__badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--slate); background: var(--slate-bg); border: 1px solid var(--slate-border);
    border-radius: 999px; padding: 2px 9px;
  }

  /* info grid */
  .info { display: flex; border: 1px solid var(--border); border-radius: 0; overflow: hidden; margin-bottom: 16px; }

  .info__col { flex: 1; padding: 13px 16px; }

  .info__col + .info__col { border-left: 1px solid var(--border); }

  .info__label { font-size: 10px; font-weight: 700; color: var(--amber-dark); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }

  .info__value { font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.35; }

  .info__value--mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 15px; }

  /* actor row */
  .actor {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: #f8f9fc; border: 1px solid var(--border);
    border-radius: 0; margin-bottom: 16px;
  }

  .actor__avatar {
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%;
    /* per-name colour (hash → palette) — "Daniel Koh" → cyan */
    background: #0891b2;
    color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .actor__name { font-size: 13px; font-weight: 700; color: var(--ink); }

  .actor__email { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

  .actor__label { margin-left: auto; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

  /* confirm — neutral slate "viewed" info */
  .confirm {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--slate-bg); border: 1px solid var(--slate-border);
    border-radius: 0; padding: 15px 16px; margin-bottom: 20px;
  }

  .confirm__icon { flex: 0 0 auto; width: 20px; height: 20px; margin-top: 1px; }

  .confirm p { font-size: 13.5px; color: var(--slate-ink); line-height: 1.6; }

  /* cta — centred */
  .cta { margin-bottom: 20px; text-align: center; }

  .cta__btn {
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--amber); border: 1px solid var(--amber-dark); color: #16191f;
    font-family: inherit; font-size: 14px; font-weight: 700;
    padding: 11px 22px; border-radius: 0; text-decoration: none;
    transition: background 0.15s ease;
  }

  .cta__btn:hover { background: var(--amber-dark); }

  /* ── Footer ── */
  .mail__footer {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 28px 18px;
    background: #fff; border-top: 1px solid var(--border);
  }

  .mail__footer p { font-size: 11.5px; color: var(--muted); }

  .mail__footer-brand { font-size: 11px; font-weight: 600; color: var(--navy); letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }

  @media (max-width: 520px) {
    .info { flex-direction: column; }
    .info__col + .info__col { border-left: none; border-top: 1px solid var(--border); }
    .mail__header { flex-direction: column; align-items: flex-start; padding: 16px 20px; }
    .mail__body { padding: 22px 18px 6px; }
    .mail__footer { flex-direction: column; align-items: flex-start; padding: 14px 20px 18px; }
  }
</style>
</head>
<body>

<div class="mail">

  <!-- Header: brand + logo -->
  <div class="mail__header">
    <div class="mail__brand">
      <img class="mail__logo" src="invoice.png" alt="LG CNS Logo" title="verify logo here">
      <span class="mail__brand-title">LG CNS · Invoice</span>
    </div>
    <div class="mail__header-side">
      <span class="mail__pulse"></span>
      <span>Notification</span>
    </div>
  </div>

  <!-- Body -->
  <div class="mail__body">

    <!-- Headline -->
    <div class="headline">
      <div class="headline__icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5b6478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <h1 class="headline__title">
        Invoice Viewed
        <span class="headline__badge">Viewed</span>
      </h1>
    </div>

    <!-- Info grid -->
    <div class="info">
      <div class="info__col">
        <div class="info__label">Invoice No</div>
        <div class="info__value info__value--mono">INV-2026-0142</div>
      </div>
      <div class="info__col">
        <div class="info__label">Client</div>
        <div class="info__value">Northfield Partners Pte Ltd</div>
      </div>
    </div>

    <!-- Actor: viewed by -->
    <div class="actor">
      <div class="actor__avatar">DK</div>
      <div>
        <div class="actor__name">Daniel Koh</div>
        <div class="actor__email">d-koh@lgcns.com</div>
      </div>
      <span class="actor__label">Viewed by</span>
    </div>

    <!-- Confirm -->
    <div class="confirm">
      <svg class="confirm__icon" viewBox="0 0 24 24" fill="none" stroke="#5b6478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <p>
        Your invoice <strong>INV-2026-0142</strong> was opened by <strong>Daniel Koh</strong>.
      </p>
    </div>

    <!-- CTA -->
    <div class="cta">
      <a class="cta__btn" href="#">
        Open Invoice Portal
      </a>
    </div>

  </div>

  <!-- Footer -->
  <div class="mail__footer">
    <p>Viewed on 15 Sep 2026 · 10:42 SGT</p>
    <span class="mail__footer-brand">LG CNS · Invoice System</span>
  </div>

</div>

</body>
</html>
