<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.page { padding: 36px 36px 64px; max-width: 1460px; margin: 0 auto; }

.nc-stage { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; background: var(--bg); border-top: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); }

.nc-progress { display: flex; align-items: center; justify-content: center; padding: 12px 18px; }
.pd { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 7.5px; font-weight: 700; color: #fff; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 20px; backdrop-filter: blur(2px); }

.modal { background: var(--surface); width: 100%; max-width: 720px; position: relative; animation: modalIn .2s ease; }
@keyframes modalIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border-soft); }

.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item { display: flex; gap: 14px; padding: 10px 0; position: relative; }

.tl-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; position: relative; z-index: 1; }

.tl-dot.curr.inv { background: #EBF1FE; color: #1A56DB; box-shadow: 0 0 0 4px rgba(26,86,219,0.15); }
.tl-dot.curr.ord { background: #F0EAFB; color: #6638C0; box-shadow: 0 0 0 4px rgba(102,56,192,0.15); }
.tl-dot.curr.pay { background: #FEF6E6; color: #B8770A; box-shadow: 0 0 0 4px rgba(184,119,10,0.15); }
.tl-dot.curr.ship { background: #E8F8F6; color: #0B8E82; box-shadow: 0 0 0 4px rgba(11,142,130,0.15); }
.tl-dot.curr.doc { background: #FEF2E8; color: #B85A0A; box-shadow: 0 0 0 4px rgba(184,90,10,0.15); }
.tl-dot.curr.send { background: #FDEBED; color: #D92D3A; box-shadow: 0 0 0 4px rgba(217,45,58,0.15); }
.tl-dot.curr.recv { background: #E4F7EF; color: #05905E; box-shadow: 0 0 0 4px rgba(5,144,94,0.15); }

.tl-body { flex: 1; min-width: 0; padding-top: 4px; }

        <div class="mh-t">
          <div class="mh-id" id="mhId">NEG-1001</div>
          <div class="mh-sub"><span id="mhStatus">Unread</span><span class="sp" id="mhStagePill" style="font-size:10px;">💬 Neg</span><span id="mhStage" style="font-weight:500;">NEGOTIATION</span></div>
        </div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="mb-actions">
      <button class="btn-secondary" onclick="closeModal()">Close</button>
      <button class="btn-primary" style="height:38px;font-size:13px;">Edit Negotiation</button>
    </div>
  </div>
</div>

<script>
const S = ['NEGOTIATION','ISSUE_PROFORMA_INVOICE','ORDER_ITEM','PAYMENT_CONFIRMATION','SHIPPING_SCHEDULE','DOCUMENT_COPIES','SEND_ORIGINAL_DOCUMENTS','ITEM_RECEIVED','COMPLETED'];
const SN = ['NEGOTIATION','ISSUE PROFORMA INVOICE','ORDER ITEM','PAYMENT CONFIRMATION','SHIPPING SCHEDULE','DOCUMENT COPIES','SEND ORIGINAL DOCUMENTS','ITEM RECEIVED','COMPLETED'];
const SO = { 'NEGOTIATION': {c:'neg',s:'Neg'},'ISSUE_PROFORMA_INVOICE':{c:'inv',s:'Invoice'},'ORDER_ITEM':{c:'ord',s:'Order'},'PAYMENT_CONFIRMATION':{c:'pay',s:'Payment'},'SHIPPING_SCHEDULE':{c:'ship',s:'Shipping'},'DOCUMENT_COPIES':{c:'doc',s:'Docs'},'SEND_ORIGINAL_DOCUMENTS':{c:'send',s:'Send'},'ITEM_RECEIVED':{c:'recv',s:'Rcvd'},'COMPLETED':{c:'comp',s:'Done'} };
const SI = ['💬','📄','📋','💳','🚢','📑','📨','🤝','✅'];
function fmt(s) { return s.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
function init(n) { return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function acl(n) { return (n[0]||'a').toLowerCase(); }

const W = [
  {id:1001,st:'NEGOTIATION',cb:'Rajesh Kumar',ub:'Rajesh Kumar',upd:'2026-07-10T14:30',ua:true,p:{idP:1042,br:'Toyota',mo:'Land Cruiser Prado',mi:18000,tr:42500,di:40000,re:'2023-01'},msg:'Customer requested 10% discount on the listed price. Price negotiation is currently in progress. We are awaiting the customer final decision before proceeding to invoicing.'},
  {id:1002,st:'ISSUE_PROFORMA_INVOICE',cb:'Sarah M',ub:'Sarah M',upd:'2026-07-10T12:15',ua:false,p:{idP:1087,br:'Nissan',mo:'Patrol',mi:22500,tr:55200,di:52000,re:'2022-06'},msg:'Proforma invoice has been generated and shared with the customer for review and approval. Awaiting payment confirmation.'},
  {id:1003,st:'ORDER_ITEM',cb:'John D',ub:'John D',upd:'2026-07-09T16:45',ua:true,p:{idP:1156,br:'Toyota',mo:'Hilux',mi:15300,tr:31800,di:30000,re:'2023-09'},msg:'Order has been placed with the supplier. Awaiting customer confirmation to proceed to the payment stage.'},
  {id:1004,st:'PAYMENT_CONFIRMATION',cb:'Priya L',ub:'Priya L',upd:'2026-07-09T10:30',ua:false,p:{idP:1238,br:'Nissan',mo:'X-Trail',mi:11200,tr:24600,di:23500,re:'2023-11'},msg:'Payment receipt has been uploaded to the system. Verification in progress by the finance team.'},
  {id:1005,st:'SHIPPING_SCHEDULE',cb:'Mike T',ub:'Admin',upd:'2026-07-08T09:00',ua:false,p:{idP:1342,br:'Toyota',mo:'Land Cruiser 300',mi:9800,tr:68000,di:65000,re:'2024-02'},msg:'Shipping schedule confirmed. Vessel is departing 25 July from Yokohama port. ETA will be shared soon.'},
  {id:1006,st:'DOCUMENT_COPIES',cb:'Anita K',ub:'Anita K',upd:'2026-07-07T14:20',ua:true,p:{idP:1502,br:'Toyota',mo:'RAV4',mi:7500,tr:27800,di:26000,re:'2024-01'},msg:'Bill of lading and certificate of origin have been attached to the system for customer review.'},
  {id:1007,st:'SEND_ORIGINAL_DOCUMENTS',cb:'Rajesh Kumar',ub:'Admin',upd:'2026-07-06T11:45',ua:false,p:{idP:1583,br:'Toyota',mo:'Fortuner',mi:12100,tr:36200,di:34000,re:'2023-12'},msg:'Original documents have been dispatched via DHL courier. Tracking number: DHL-789456123.'},
  {id:1008,st:'ITEM_RECEIVED',cb:'Sarah M',ub:'Sarah M',upd:'2026-07-05T16:00',ua:false,p:{idP:1659,br:'Lexus',mo:'LX 600',mi:5600,tr:82000,di:79000,re:'2024-03'},msg:'Item has been received by the customer. We are awaiting formal acknowledgment of receipt.'},
  {id:1009,st:'COMPLETED',cb:'John D',ub:'John D',upd:'2026-07-04T10:00',ua:false,p:{idP:1788,br:'Toyota',mo:'Alphard',mi:4200,tr:48500,di:47000,re:'2024-04'},msg:'Order has been completed successfully. All documents delivered and customer has signed off.'},
  {id:1010,st:'NEGOTIATION',cb:'Mike T',ub:'Mike T',upd:'2026-07-10T08:15',ua:true,p:{idP:1901,br:'Toyota',mo:'Corolla Cross',mi:1900,tr:21300,di:20000,re:'2024-06'},msg:'New inquiry received for Corolla Cross. Initial offer of $20,000 has been submitted to the customer.'},
  {id:1011,st:'ISSUE_PROFORMA_INVOICE',cb:'Priya L',ub:'Priya L',upd:'2026-07-08T13:30',ua:false,p:{idP:1947,br:'BMW',mo:'X5',mi:8400,tr:61200,di:58000,re:'2024-02'},msg:'Invoice has been prepared and sent to the customer for payment processing.'},
  {id:1012,st:'ORDER_ITEM',cb:'Anita K',ub:'Anita K',upd:'2026-07-07T15:00',ua:true,p:{idP:1988,br:'Mercedes-Benz',mo:'GLE',mi:6700,tr:72400,di:69000,re:'2024-01'},msg:'Order has been confirmed by the customer. Proceeding to the payment stage.'}
];

let pg=1,ps=10,f='all',data=[...W];
function si(s){return S.indexOf(s)}

function setFilter(n){
  document.querySelectorAll('.qf-item').forEach(e=>e.classList.remove('active'));
  event.currentTarget.classList.add('active');
  f=n; applyFilters();
}
function applyFilters(){
  const sv=document.getElementById('stageFilter').value;
  const cv=document.getElementById('carIdFilter').value;
  const uv=document.getElementById('userFilter').value;
  data=W.filter(w=>{
    if(f==='active'&&w.st==='COMPLETED')return false;
    if(f==='completed'&&w.st!=='COMPLETED')return false;
    if(f==='unread'&&!w.ua)return false;
    if(f==='payment'&&w.st!=='PAYMENT_CONFIRMATION')return false;
    if(f==='shipping'&&w.st!=='SHIPPING_SCHEDULE')return false;
    if(sv&&w.st!==sv)return false;
    if(cv&&w.p.idP!==parseInt(cv))return false;
    if(uv&&w.cb!==uv)return false;
    return true;
  });
  pg=1;render();
}

function openModal(id){
  const w=W.find(x=>x.id===id); if(!w)return;
  const idx=si(w.st);
  const inits=init(w.cb);
  const ubInits=init(w.ub);
  const ic=w.st==='COMPLETED';
  const stx=ic?'Completed':(w.ua?'Unread':'Read');
  const stageCls=SO[w.st]?SO[w.st].c:'neg';

  document.getElementById('mhAv').className='mh-av av-lg ac.'+acl(w.cb);
  document.getElementById('mhAv').textContent=inits;
  document.getElementById('mhId').textContent='NEG-'+w.id;
  document.getElementById('mhStatus').innerHTML='<span class="nc-status '+(ic?'done':(w.ua?'unread':'read'))+'">'+stx+'</span>';
  document.getElementById('mhStagePill').className='sp '+stageCls;
  document.getElementById('mhStagePill').innerHTML=SI[idx]+' '+SO[w.st].s;
  document.getElementById('mhStage').textContent=fmt(w.st);

  const dt=new Date(w.upd);
  const ds=dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const ts=dt.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});

  const timelineActs=[
    {stage:'NEGOTIATION',by:'Rajesh Kumar',msg:'Negotiation started with initial offer'},
    {stage:'ISSUE_PROFORMA_INVOICE',by:'Sarah M',msg:'Proforma invoice created and shared'},
    {stage:'ORDER_ITEM',by:'John D',msg:'Order placed with supplier'},
    {stage:'PAYMENT_CONFIRMATION',by:'Priya L',msg:'Payment confirmed and verified'},
    {stage:'SHIPPING_SCHEDULE',by:'Mike T',msg:'Shipping scheduled with carrier'},
    {stage:'DOCUMENT_COPIES',by:'Anita K',msg:'Copies of documents uploaded'},
    {stage:'SEND_ORIGINAL_DOCUMENTS',by:'Admin',msg:'Original documents dispatched'},
    {stage:'ITEM_RECEIVED',by:'Sarah M',msg:'Item received by customer'},
    {stage:'COMPLETED',by:'John D',msg:'Order completed and closed'}
  ];

  let tlHtml='';
  S.forEach((s,i)=>{
    const dotCls=i<idx?'done '+(SO[s]?SO[s].c:'neg'):(i===idx?'curr '+(SO[s]?SO[s].c:'neg'):'pend');
    const icon=i<idx?'✓':(i===idx?SI[idx]:'');
    const isCurr=i===idx;
    const act=i<=idx?timelineActs[i]:null;
    const actInits=act?init(act.by):'';
    const actCl=act?acl(act.by):'a';
    tlHtml+=`<div class="tl-item">
      <div class="tl-dot ${dotCls}">${icon}</div>
      <div class="tl-body">
        <div class="tl-title ${isCurr?'curr '+stageCls:''}">${SI[i]} ${SN[i]}</div>
        ${act?`<div class="tl-sub"><span class="ac ${actCl}" style="width:18px;height:18px;font-size:6.5px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;flex-shrink:0;">${actInits}</span><strong>${act.by}</strong> — ${act.msg}</div>`:''}
        ${i===idx?`<div class="tl-stamp">🕐 ${ds} at ${ts}</div>`:''}
      </div>
    </div>`;
  });

  const bodyHtml=`
    <div class="mb-section">
      <div class="mb-label">📦 Product Details</div>
      <div class="product-detail-grid">
        <div class="pd-item" style="border-left:3px solid var(--blue);"><span class="l">🏷️ Brand</span><span class="v">${w.p.br}</span></div>
        <div class="pd-item" style="border-left:3px solid var(--purple);"><span class="l">🚗 Model</span><span class="v">${w.p.mo}</span></div>
        <div class="pd-item" style="border-left:3px solid var(--blue);"><span class="l">🔢 Product ID</span><span class="v" style="color:var(--blue);font-weight:700;">PA-${w.p.idP}</span></div>
        <div class="pd-item" style="border-left:3px solid var(--teal);"><span class="l">📏 Mileage</span><span class="v">${w.p.mi.toLocaleString()} km</span></div>
        <div class="pd-item" style="border-left:3px solid var(--orange);"><span class="l">💰 Trade Price</span><span class="v" style="font-weight:500;color:var(--text-3);text-decoration:line-through;">$${w.p.tr.toLocaleString()}</span></div>
        <div class="pd-item" style="border-left:3px solid var(--green);"><span class="l">🏷️ Discounted</span><span class="v" style="color:var(--green);font-weight:700;">$${w.p.di.toLocaleString()}</span></div>
        <div class="pd-item" style="border-left:3px solid var(--amber);"><span class="l">📅 Registration</span><span class="v">${w.p.re.replace('-','/')}</span></div>
        <div class="pd-item" style="border-left:3px solid var(--red);"><span class="l">🕐 Last Updated</span><span class="v">${ds}</span></div>
      </div>
    </div>
    <div class="mb-section">
      <div class="mb-label">📝 Customer Notes</div>
      <div style="padding:14px 16px;background:var(--bg);font-size:13px;color:var(--text-2);line-height:1.7;border-left:3px solid var(--blue);">${w.msg}</div>
    </div>
    <div class="mb-section">
      <div class="mb-label">👤 Users</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="user-row blue"><div class="av-lg ac.${acl(w.cb)}">${inits}</div><div class="ur-info"><div class="ur-label">Created By</div><div class="ur-name">${w.cb}</div></div></div>
        <div class="user-row green"><div class="av-lg ac.${acl(w.ub)}">${ubInits}</div><div class="ur-info"><div class="ur-label">Last Updated By</div><div class="ur-name">${w.ub}</div></div></div>
      </div>
    </div>
    <div class="mb-section">
      <div class="mb-label">🔄 Workflow Timeline</div>
      <div class="timeline">${tlHtml}</div>
    </div>
  `;

  document.getElementById('modalBody').innerHTML=bodyHtml;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow='';
}

function renderCards(){
  const g=document.getElementById('grid');
  const st=(pg-1)*ps;
  const pd=data.slice(st,st+ps);
  if(!pd.length){g.innerHTML='<div class="empty"><strong>No negotiations found</strong><div style="margin-top:6px;font-size:13px;">Try adjusting your filters</div></div>';return;}
  g.innerHTML=pd.map(w=>{
    const idx=si(w.st); const o=SO[w.st]||{c:'neg',s:'Neg'};
    const ic=w.st==='COMPLETED'; const sc=ic?'done':(w.ua?'unread':'read'); const stx=ic?'Completed':(w.ua?'Unread':'Read');
    let ph=''; S.forEach((_,i)=>{if(i>0)ph+=`<div class="pl ${i<=idx?'done':''}"></div>`;ph+=`<div class="pd ${i<idx?'done':(i===idx?'curr':'pend')}">${i<idx?'✓':''}</div>`;});
    const d=new Date(w.upd); const ds=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const inits=init(w.cb); const ubInits=init(w.ub);
    return `<div class="nc">
      <div class="nc-hdr"><div class="nc-id"><span class="av-s ac.${acl(w.cb)}">${inits}</span>NEG-${w.id}</div><div class="nc-status ${sc}">${stx}</div></div>
      <div class="nc-body">
        <div class="nc-product"><div class="nc-img">${SI[idx]}</div>
          <div class="nc-pi">
            <div class="nc-pi-r"><span class="l">Product</span><span class="v">${w.p.br} ${w.p.mo}</span></div>
            <div class="nc-pi-r"><span class="l">ID</span><span class="v" style="color:var(--blue);">PA-${w.p.idP}</span></div>
            <div class="nc-pi-r"><span class="l">Mileage</span><span class="v">${w.p.mi.toLocaleString()} km</span></div>
            <div class="nc-pi-r"><span class="l">Price</span><span class="v strike">$${w.p.tr.toLocaleString()}</span><span class="v disc">$${w.p.di.toLocaleString()}</span></div>
          </div>
        </div>
        <div class="nc-msg">${w.msg}</div>
      </div>
      <div class="nc-stage">
        <div class="nc-stage-l">
          <div class="nc-stage-dot"></div>
          <div><div class="nc-stage-label">${fmt(w.st)}</div><div class="nc-stage-sub"><span class="ac.${acl(w.ub)}" style="width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;flex-shrink:0;">${ubInits}</span>${w.ub}</div></div>
        </div>
        <span class="sp ${o.c}">${SI[idx]} ${o.s}</span>
      </div>
      <div class="nc-progress">${ph}</div>
      <div class="nc-info">
        <div class="nc-ii"><div class="l">Created By</div><div class="v"><span class="ac.${acl(w.cb)}">${inits}</span>${w.cb}</div></div>
        <div class="nc-ii"><div class="l">Updated</div><div class="v">${ds}</div></div>
        <div class="nc-ii"><div class="l">Registration</div><div class="v">${w.p.re.replace('-','/')}</div></div>
      </div>
      <div class="nc-foot"><button class="btn-outline" onclick="openModal(${w.id})">View Details <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button></div>
    </div>`;
  }).join('');
}

function renderPag(){
  const el=document.getElementById('pagination');
  const t=Math.max(1,Math.ceil(data.length/ps));
  if(data.length<=ps){el.innerHTML='';return;}
  const st=(pg-1)*ps+1; const en=Math.min(pg*ps,data.length);
  let h=`<div class="pg-info">Showing ${st}&ndash;${en} of ${data.length}</div><div class="pg-right"><div class="pg-size"><label>Rows:</label><select onchange="cps(this.value)">${[5,10,25,50,100].map(n=>`<option value="${n}" ${n===ps?'selected':''}>${n}</option>`).join('')}</select></div><div class="pg-pages">`;
  h+=`<button class="pg-arrow ${pg===1?'disabled':''}" onclick="gtp(${pg-1})">&#8249;</button>`;
  const pgs=[]; for(let i=1;i<=t;i++){if(i===1||i===t||(i>=pg-1&&i<=pg+1))pgs.push(i);else if(pgs[pgs.length-1]!==-1)pgs.push(-1);}
  pgs.forEach(p=>{if(p===-1)h+='<button class="flat">&hellip;</button>';else h+=`<button class="${p===pg?'active':''}" onclick="gtp(${p})">${p}</button>`;});
  h+=`<button class="pg-arrow ${pg===t?'disabled':''}" onclick="gtp(${pg+1})">&#8250;</button></div></div>`;
  el.innerHTML=h;
}

function cps(s){ps=parseInt(s);pg=1;render();}
function gtp(p){if(p<1||p>Math.ceil(data.length/ps))return;pg=p;render();}

function render(){
  const a=W.filter(w=>w.st!=='COMPLETED').length; const c=W.filter(w=>w.st==='COMPLETED').length;
  const u=W.filter(w=>w.ua).length; const py=W.filter(w=>w.st==='PAYMENT_CONFIRMATION').length; const sh=W.filter(w=>w.st==='SHIPPING_SCHEDULE').length;
  document.getElementById('cAll').textContent=W.length; document.getElementById('cActive').textContent=a;
  document.getElementById('cCompleted').textContent=c; document.getElementById('cUnread').textContent=u;
  document.getElementById('cPay').textContent=py; document.getElementById('cShip').textContent=sh;
  renderCards();renderPag();
}

const sel=document.getElementById('stageFilter');
S.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=SO[s].s+' — '+fmt(s);sel.appendChild(o);});
render();
</script>
</body></html>
