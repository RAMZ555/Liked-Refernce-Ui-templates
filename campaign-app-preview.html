<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Management — App Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,650;14..32,700;14..32,800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F4F5F7;--surface:#FFF;--border:#DFE1E6;--border-soft:#EBECF0;--text:#172B4D;--text-2:#6B778C;--text-3:#959DA8;--blue:#0C66E4;--blue-dark:#0747A6;--blue-bg:#E9F2FF;--blue-rgb:12,102,228;--green:#05905E;--green-bg:#E4F7EF;--red:#D92D3A;--red-bg:#FDEBED;--amber:#B8770A;--amber-bg:#FEF6E6;--purple:#6638C0;--purple-bg:#F0EAFB;--teal:#0B8E82;--teal-bg:#E8F8F6;--orange:#B85A0A;--orange-bg:#FEF2E8}
body{background:var(--bg);min-height:100vh;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text);font-size:14px}

/* TOPNAV */
.topnav{height:52px;background:#0747A6;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100}
.topnav-l{display:flex;align-items:center;gap:10px}
.tdots{display:flex;gap:5px;align-items:center}
.td{width:10px;height:10px;border-radius:50%;display:inline-block}
.td.r{background:#ff5f56}.td.y{background:#ffbd2e}.td.g{background:#27c93f}
.bc{color:rgba(255,255,255,.6);font-size:13px}
.bc.active{color:#fff;font-weight:600}.bc-sep{color:rgba(255,255,255,.4);font-size:13px}
.topnav-r{display:flex;align-items:center;gap:10px}
.topnav-link{color:#fff;text-decoration:none;font-size:12px;font-weight:600;padding:6px 12px;border-radius:6px;background:rgba(255,255,255,.12);display:inline-block}
.topnav-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:rgba(255,255,255,.15)}

/* PAGE */
.page{padding:24px 28px;max-width:1440px;margin:0 auto}
.page-hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.page-hdr .icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page-hdr .ht{flex:1}
.page-hdr .ht h1{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-hdr .ht h1 .badge{font-size:10px;font-weight:600;padding:2px 10px;background:var(--blue-bg);color:var(--blue);letter-spacing:.02em}
.page-hdr .ht p{font-size:14px;color:var(--text-2);margin:3px 0 0;font-weight:450}
.page-hdr-actions{display:flex;align-items:center;gap:8px}
.btn-outline{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:7px 14px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;font-family:inherit;text-decoration:none}
.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-primary{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:7px 16px;background:var(--blue);color:#fff;border:none;cursor:pointer;font-family:inherit;text-decoration:none}
.btn-primary:hover{background:var(--blue-dark)}

/* QUICK FILTERS */
.quick-filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.qf-item{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;font-size:12.5px;font-weight:500;color:var(--text-2);border:1px solid var(--border);background:var(--surface);user-select:none}
.qf-item.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.qf-item .count{font-size:10.5px;font-weight:700;padding:0 7px;background:var(--bg);height:20px;display:flex;align-items:center}
.qf-item.active .count{background:rgba(255,255,255,.18);color:#fff}

/* CARD WRAPPER */
.card-wrap{background:var(--surface);border:1px solid var(--border)}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#FAFBFC;border-bottom:1px solid var(--border)}
.table-header-l{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text)}
.table-header-l svg{color:var(--blue)}
.count-pill{font-size:11px;font-weight:600;padding:2px 10px;color:#42526E;background:#DFE1E6;border-radius:10px}

/* VIEW TOGGLE */
.view-toggle{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px;cursor:pointer;user-select:none}
.toggle-opt{width:30px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text-3);transition:all .12s}
.toggle-opt.active{background:var(--surface);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* CARD VIEW */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px;padding:20px}
.nc{background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column}
.nc-hdr{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-soft)}
.nc-id{font-size:13px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:8px}
.nc-id .av-s{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}
.nc-status{font-size:10.5px;font-weight:600;padding:4px 12px;letter-spacing:.02em}
.nc-status.active{background:var(--green-bg);color:var(--green)}
.nc-status.draft{background:var(--amber-bg);color:var(--amber)}
.nc-status.sent{background:var(--purple-bg);color:var(--purple)}
.nc-body{padding:14px 18px;flex:1;display:flex;flex-direction:column;gap:12px}
.nc-banner-preview{width:100%;height:80px;background:var(--bg);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.nc-banner-preview .placeholder{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-3);font-size:11px}
.nc-message{font-size:12.5px;color:var(--text-2);line-height:1.6;padding:10px 12px;background:var(--bg);border-left:3px solid var(--blue);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc-products{display:flex;flex-direction:column;gap:8px}
.nc-products .plabel{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.nc-product-mini{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border:1px solid var(--border-soft)}
.nc-product-mini .pm-icon{width:36px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.nc-product-mini .pm-info{flex:1;min-width:0}
.nc-product-mini .pm-info .pm-name{font-size:12px;font-weight:600;color:var(--text)}
.nc-product-mini .pm-info .pm-price{font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.nc-product-mini .pm-info .pm-price .orig{text-decoration:line-through;color:var(--text-3)}
.nc-product-mini .pm-info .pm-price .disc{color:var(--green);font-weight:600}
.more-cars{font-size:11px;font-weight:600;color:var(--blue);padding:6px 10px;background:var(--blue-bg);display:inline-flex;align-items:center;gap:5px;align-self:flex-start;cursor:pointer}
.nc-foot{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border-soft);background:var(--bg)}
.nc-foot .nc-date{font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.nc-foot-actions{display:flex;gap:6px}
.nc-foot-btn{width:30px;height:30px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-2);transition:all .12s;font-family:inherit}
.nc-foot-btn:hover{border-color:var(--blue);color:var(--blue)}
.nc-foot-btn.danger:hover{border-color:var(--red);color:var(--red)}

/* TABLE VIEW (AG Grid simulation) */
.ag-root{display:flex;flex-direction:column}
.ag-header{background:#1a2d6b;display:flex;border-bottom:2px solid #1a2d6b}
.ag-header-cell{padding:10px 12px;color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;flex:1;display:flex;align-items:center;border-right:1px solid rgba(255,255,255,.08)}
.ag-header-cell:last-child{border-right:none}
.ag-body{display:flex;flex-direction:column}
.ag-row{display:flex;border-bottom:1px solid var(--border);transition:background .1s}
.ag-row:hover{background:#E9F2FF!important}
.ag-row:nth-child(even){background:#FAFBFC}
.ag-cell{padding:10px 12px;font-size:13px;color:var(--text);flex:1;display:flex;align-items:center;border-right:1px solid var(--border-soft);min-height:42px}
.ag-cell:last-child{border-right:none}
.ag-cell.bold{font-weight:700}
.ag-cell.id{color:var(--blue);font-weight:600;font-size:12px}
.ag-cell.action{justify-content:center}
.view-btn{background:var(--blue);color:#fff;border:none;padding:4px 14px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}

/* AVATARS */
.ac{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;flex-shrink:0}
.av-lg{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.ac.a{background:#1A56DB}.ac.b{background:#6638C0}.ac.c{background:#05905E}
.ac.d{background:#D92D3A}.ac.e{background:#B8770A}.ac.f{background:#0B8E82}
.ac.g{background:#4338CA}.ac.h{background:#C1223A}.ac.i{background:#B85A0A}
.ac.j{background:#6366F1}.ac.k{background:#0A7490}.ac.l{background:#9333EA}
.ac.m{background:#BE185D}.ac.n{background:#B85A0A}.ac.o{background:#2563EB}
.ac.p{background:#16A34A}.ac.q{background:#D92D3A}.ac.r{background:#0891B2}
.ac.s{background:#15803D}.ac.t{background:#6D28D9}.ac.u{background:#DC2626}
.ac.v{background:#0A7490}.ac.w{background:#BE185D}.ac.x{background:#4F46E5}
.ac.y{background:#65A30D}.ac.z{background:#B8770A}

/* EMPTY */
.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--text-2)}
.empty strong{color:var(--text);font-size:15px}
.empty div{margin-top:6px;font-size:13px}

@media(max-width:860px){.page{padding:24px 18px 48px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-l">
    <div class="tdots"><span class="td r"></span><span class="td y"></span><span class="td g"></span></div>
    <span class="bc">Admin</span><span class="bc-sep">/</span><span class="bc active">Campaign</span>
  </div>
  <div class="topnav-r">
    <a class="topnav-link" style="cursor:default">Products</a>
    <div class="topnav-av">A</div>
  </div>
</nav>

<div class="page">
  <div class="page-hdr">
    <div class="icon" style="background:#E9F2FF;color:#0C66E4">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/><circle cx="12" cy="12" r="10" fill="none"/></svg>
    </div>
    <div class="ht">
      <h1>Campaign Management <span class="badge">6 total</span></h1>
      <p>Create and manage email campaigns for your customers</p>
    </div>
    <div class="page-hdr-actions">
      <a class="btn-outline" style="cursor:default">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
        View Banner
      </a>
      <a class="btn-primary" style="cursor:default">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Campaign
      </a>
    </div>
  </div>

  <div class="quick-filters">
    <div class="qf-item active">All <span class="count">6</span></div>
  </div>

  <div class="card-wrap">
    <div class="table-header">
      <div class="table-header-l">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        Campaigns
        <span class="count-pill">6 campaigns</span>
      </div>
      <div class="view-toggle" id="viewToggle">
        <span class="toggle-opt active" data-view="card" onclick="switchView('card')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
        </span>
        <span class="toggle-opt" data-view="table" onclick="switchView('table')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </span>
      </div>
    </div>

    <!-- CARD VIEW -->
    <div id="cardView">
      <div class="grid" id="cardGrid"></div>
    </div>

    <!-- TABLE VIEW (hidden by default) -->
    <div id="tableView" style="display:none">
      <div class="ag-root">
        <div class="ag-header">
          <div class="ag-header-cell" style="flex:0.5">Id</div>
          <div class="ag-header-cell" style="flex:1.2">Campaign No</div>
          <div class="ag-header-cell" style="flex:1.5">Campaign Title</div>
          <div class="ag-header-cell" style="flex:0.8">Total Cars</div>
          <div class="ag-header-cell" style="flex:1">Email Sent On</div>
          <div class="ag-header-cell" style="flex:0.6">Action</div>
        </div>
        <div class="ag-body" id="tableBody"></div>
      </div>
    </div>
  </div>
</div>

<script>
const campaigns = [
  { id: 101, campaignBannerId: 'CAMP-2026-001', name: 'Summer Clearance Sale', status: 'active', statusL: 'Active', description: 'Don\'t miss out on our biggest summer clearance event! Up to 40% off on select luxury vehicles.', totalCars: 5, createdDateTime: '10 Jul 2026', products: [
    { brand: 'Toyota', model: 'Land Cruiser', id: 3281, tradePrice: 28500, discountedPrice: 26800, fuelType: 'Petrol', transmission: 'Automatic' },
    { brand: 'BMW', model: 'X5 M50i', id: 3402, tradePrice: 52000, discountedPrice: 49800, fuelType: 'Petrol', transmission: 'Automatic' },
    { brand: 'Mercedes-Benz', model: 'C300 AMG', id: 2915, tradePrice: 22500, discountedPrice: 21000, fuelType: 'Petrol', transmission: 'Automatic' },
    { brand: 'Audi', model: 'Q7', id: 3104, tradePrice: 33500, discountedPrice: 32000, fuelType: 'Diesel', transmission: 'Automatic' },
    { brand: 'Lexus', model: 'RX 350', id: 3045, tradePrice: 37900, discountedPrice: 36500, fuelType: 'Petrol', transmission: 'Automatic' },
  ]},
  { id: 102, campaignBannerId: 'CAMP-2026-002', name: 'New Arrivals — July 2026', status: 'sent', statusL: 'Sent', description: 'Check out our latest inventory! Brand new stock just arrived from Japan and Germany.', totalCars: 3, createdDateTime: '08 Jul 2026', products: [
    { brand: 'Audi', model: 'Q7', id: 3104, tradePrice: 33500, discountedPrice: 32000, fuelType: 'Diesel', transmission: 'Automatic' },
    { brand: 'Lexus', model: 'RX 350', id: 3045, tradePrice: 37900, discountedPrice: 36500, fuelType: 'Petrol', transmission: 'Automatic' },
  ]},
  { id: 103, campaignBannerId: 'CAMP-2026-003', name: 'End of Season Offers', status: 'draft', statusL: 'Draft', description: 'Last chance to grab the best deals of the season. Prices slashed on premium sedans and SUVs.', totalCars: 2, createdDateTime: '05 Jul 2026', products: [
    { brand: 'Porsche', model: 'Cayenne', id: 3567, tradePrice: 68900, discountedPrice: 64500, fuelType: 'Petrol', transmission: 'Automatic' },
  ]},
  { id: 104, campaignBannerId: 'CAMP-2026-004', name: 'Luxury Weekend Special', status: 'active', statusL: 'Active', description: 'This weekend only — enjoy exclusive discounts on our premium collection of luxury vehicles.', totalCars: 7, createdDateTime: '02 Jul 2026', products: [
    { brand: 'Range Rover', model: 'Velar', id: 3721, tradePrice: 45900, discountedPrice: 42900, fuelType: 'Diesel', transmission: 'Automatic' },
    { brand: 'BMW', model: '7 Series', id: 3845, tradePrice: 62500, discountedPrice: 58900, fuelType: 'Petrol', transmission: 'Automatic' },
    { brand: 'Mercedes-Benz', model: 'EQS', id: 3902, tradePrice: 78900, discountedPrice: 74900, fuelType: 'Electric', transmission: 'Automatic' },
  ]},
  { id: 105, campaignBannerId: 'CAMP-2026-005', name: 'First Time Buyer Program', status: 'draft', statusL: 'Draft', description: 'Special financing options for first-time buyers. Low down payment and flexible EMI plans.', totalCars: 4, createdDateTime: '28 Jun 2026', products: [
    { brand: 'Toyota', model: 'Camry', id: 2650, tradePrice: 18900, discountedPrice: 17500, fuelType: 'Petrol', transmission: 'Automatic' },
    { brand: 'Honda', model: 'Accord', id: 2712, tradePrice: 16500, discountedPrice: 15500, fuelType: 'Petrol', transmission: 'CVT' },
  ]},
  { id: 106, campaignBannerId: 'CAMP-2026-006', name: 'Year-End Clearance', status: 'sent', statusL: 'Sent', description: 'Our biggest sale of the year is here! Massive discounts on 2025 models.', totalCars: 10, createdDateTime: '20 Jun 2026', products: [
    { brand: 'Audi', model: 'A6', id: 3250, tradePrice: 28900, discountedPrice: 25900, fuelType: 'Diesel', transmission: 'Automatic' },
    { brand: 'BMW', model: '3 Series', id: 3380, tradePrice: 24900, discountedPrice: 22900, fuelType: 'Petrol', transmission: 'Automatic' },
    { brand: 'Mercedes-Benz', model: 'E Class', id: 3460, tradePrice: 31900, discountedPrice: 28900, fuelType: 'Diesel', transmission: 'Automatic' },
  ]},
];

const initials = s => s ? s.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) : 'NA';
const avatarClass = s => { const map='abcdefghijklmnopqrstuvwxyz'; return 'ac ' + map[(s||'A').charCodeAt(0)%26]; };
const fmtCurrency = n => '$' + Number(n).toLocaleString();

const brandColors = {
  'Toyota':'#DC2626','BMW':'#2563EB','Mercedes-Benz':'#05905E','Audi':'#6638C0','Lexus':'#B8770A',
  'Range Rover':'#0B8E82','Honda':'#BE185D','Porsche':'#4338CA'
};
const brandIcons = {
  'Toyota':'🚗','BMW':'🚙','Mercedes-Benz':'🏎️','Audi':'🚗','Lexus':'🚘',
  'Range Rover':'🛻','Honda':'🚙','Porsche':'🏁'
};

// Build cards
const grid = document.getElementById('cardGrid');
campaigns.forEach(item => {
  const card = document.createElement('div');
  card.className = 'nc';
  const remainingCount = item.totalCars - item.products.length;
  card.innerHTML = `
    <div class="nc-hdr">
      <div class="nc-id"><span class="av-s ${avatarClass(item.name)}">${initials(item.name)}</span>${item.campaignBannerId}</div>
      <div class="nc-status ${item.status}">${item.statusL}</div>
    </div>
    <div class="nc-body">
      <div class="nc-banner-preview"><div class="placeholder"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Campaign Banner</div></div>
      <div class="nc-message">${item.description}</div>
      <div class="nc-products">
        <div class="plabel"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>Products (${item.totalCars})</div>
        ${item.products.slice(0,3).map(p => {
          const bc = brandColors[p.brand]||'#2563EB'; const bi = brandIcons[p.brand]||'🚗';
          return `<div class="nc-product-mini"><div class="pm-icon" style="background:${bc}22;border:1px solid ${bc}44;border-radius:4px">${bi}</div><div class="pm-info"><div class="pm-name">${p.brand} ${p.model}</div><div class="pm-price"><span class="orig">${fmtCurrency(p.tradePrice)}</span> <span class="disc">${fmtCurrency(p.discountedPrice)}</span></div></div></div>`;
        }).join('')}
        ${remainingCount > 0 ? `<span class="more-cars">+${remainingCount} more car${remainingCount>1?'s':''} →</span>` : ''}
      </div>
    </div>
    <div class="nc-foot">
      <div class="nc-date"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${item.createdDateTime}</div>
      <div class="nc-foot-actions">
        <button class="nc-foot-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="nc-foot-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="nc-foot-btn danger"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div>
    </div>
  `;
  grid.appendChild(card);
});

// Build table
const tbody = document.getElementById('tableBody');
campaigns.forEach(item => {
  const row = document.createElement('div');
  row.className = 'ag-row';
  row.innerHTML = `
    <div class="ag-cell id" style="flex:0.5">${item.id}</div>
    <div class="ag-cell" style="flex:1.2;font-weight:600;">${item.campaignBannerId}</div>
    <div class="ag-cell" style="flex:1.5">${item.name}</div>
    <div class="ag-cell" style="flex:0.8"><span style="display:inline-block;padding:2px 10px;font-size:10.5px;font-weight:600;background:var(--green-bg);color:var(--green)">${item.totalCars} cars</span></div>
    <div class="ag-cell bold" style="flex:1">${item.createdDateTime}</div>
    <div class="ag-cell action" style="flex:0.6"><button class="view-btn">View</button></div>
  `;
  tbody.appendChild(row);
});

function switchView(view) {
  document.querySelectorAll('.toggle-opt').forEach(el => el.classList.remove('active'));
  document.querySelector(`.toggle-opt[data-view="${view}"]`).classList.add('active');
  document.getElementById('cardView').style.display = view === 'card' ? 'block' : 'none';
  document.getElementById('tableView').style.display = view === 'table' ? 'block' : 'none';
}
</script>
</body>
</html>
