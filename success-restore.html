<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Success — Restored</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:#F2F4F7; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .modal { width:380px; background:#FFF; border-radius:16px; box-shadow:0 0 0 1px rgba(0,0,0,.04),0 20px 48px -8px rgba(0,0,0,.10),0 8px 16px -6px rgba(0,0,0,.06); animation:modalIn .3s cubic-bezier(.16,1,.3,1); overflow:hidden; }
    .accent-bar { height:3px; background:linear-gradient(90deg,#12275C 33%,#D97757 66%,#00B886); }
    .modal__inner { padding:32px 28px 24px; text-align:center; }
    .icon-large { width:56px; height:56px; margin:0 auto 16px; border-radius:50%; background:#F5F0FF; border:2px solid #DDCEF7; display:flex; align-items:center; justify-content:center; animation:ringPop .4s cubic-bezier(.16,1,.3,1) .05s both; }
    .icon-undo { width:28px; height:28px; stroke:#7C5CBF; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:40; stroke-dashoffset:40; animation:drawCheck .4s ease-out .2s forwards; }
    .modal__title { font-size:18px; font-weight:700; color:#12275C; letter-spacing:-.02em; margin-bottom:4px; animation:fadeUp .35s ease-out .1s both; }
    .modal__sub { font-size:13px; font-weight:500; color:#6B7280; margin-bottom:20px; animation:fadeUp .35s ease-out .15s both; }
    .modal__sub strong { color:#12275C; font-weight:600; }
    .badge-wrap { display:flex; justify-content:center; margin-bottom:20px; animation:fadeUp .35s ease-out .18s both; }
    .badge { display:inline-flex; align-items:center; gap:5px; padding:4px 14px; border-radius:20px; font-size:12px; font-weight:700; background:#F5F0FF; color:#7C5CBF; border:1px solid #DDCEF7; }
    .detail-card { background:#F0F2F6; border:1.5px solid #D6DAE2; border-radius:10px; padding:12px 16px; margin-bottom:20px; text-align:left; animation:fadeUp .35s ease-out .2s both; }
    .detail-row { display:flex; align-items:center; justify-content:space-between; padding:5px 0; }
    .detail-row+.detail-row { border-top:1px solid #D6DAE2; }
    .detail-label { font-size:12px; font-weight:500; color:#6B7280; }
    .detail-value { font-size:13px; font-weight:600; color:#12275C; letter-spacing:-.01em; }
    .detail-amount { color:#D97757; font-weight:700; }
    .restore-tag { font-size:11px; font-weight:600; color:#7C5CBF; background:#F5F0FF; border-radius:4px; padding:1px 6px; }
    .actions { display:flex; flex-direction:column; gap:8px; animation:fadeUp .35s ease-out .25s both; }
    .btn { display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 20px; border-radius:9px; font-size:13px; font-weight:600; font-family:inherit; border:none; cursor:pointer; transition:all .15s ease; }
    .btn--primary { background:#12275C; color:#FFF; box-shadow:0 2px 8px rgba(18,39,92,.15); }
    .btn--primary:hover { background:#1A3A7A; box-shadow:0 4px 14px rgba(18,39,92,.22); transform:translateY(-1px); }
    .btn--primary:active { transform:translateY(0); }
    .btn--ghost { background:transparent; color:#6B7280; border:1px solid #E0E3E7; }
    .btn--ghost:hover { background:#F8F9FC; color:#12275C; border-color:#C5C9D0; }
    @keyframes modalIn { from{opacity:0;transform:scale(.95) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
    @keyframes ringPop { from{opacity:0;transform:scale(.5)} to{opacity:1;transform:scale(1)} }
    @keyframes drawCheck { to{stroke-dashoffset:0} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="accent-bar"></div>
    <div class="modal__inner">
      <div class="icon-large">
        <svg class="icon-undo" viewBox="0 0 24 24">
          <path d="M3 10h13a5 5 0 0 1 0 10H9"/>
          <path d="M7 6l-4 4 4 4"/>
        </svg>
      </div>
      <h2 class="modal__title">Invoice Restored</h2>
      <p class="modal__sub"><strong>INV-2026-0042</strong> &middot; previous version recovered</p>
      <div class="badge-wrap">
        <span class="badge">
          <svg width="11" height="11" viewBox="0 0 10 10" fill="none"><circle cx="5" cy="5" r="4" stroke="currentColor" stroke-width="1.2"/><path d="M3 5l1.5 1.5L7 3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Version Restored
        </span>
      </div>
      <div class="detail-card">
        <div class="detail-row"><span class="detail-label">Payer</span><span class="detail-value">Mizuho Bank</span></div>
        <div class="detail-row"><span class="detail-label">Amount</span><span class="detail-value detail-amount">SGD 12,450.00</span></div>
        <div class="detail-row"><span class="detail-label">Version</span><span class="detail-value"><span class="restore-tag">v2.1 → v2.0</span></span></div>
      </div>
      <div class="actions">
        <button class="btn btn--primary">View Invoice</button>
        <button class="btn btn--ghost">Audit History</button>
      </div>
    </div>
  </div>
</body>
</html>
