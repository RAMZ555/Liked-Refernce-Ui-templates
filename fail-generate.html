<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error — Generate Failed</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:#F2F4F7; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .modal { width:380px; background:#FFF; border-radius:16px; box-shadow:0 0 0 1px rgba(0,0,0,.04),0 20px 48px -8px rgba(0,0,0,.10),0 8px 16px -6px rgba(0,0,0,.06); animation:modalIn .3s cubic-bezier(.16,1,.3,1); overflow:hidden; }
    .accent-bar { height:3px; background:linear-gradient(90deg,#B71C1C,#E65100); }
    .modal__inner { padding:32px 28px 24px; text-align:center; }
    .icon-large { width:56px; height:56px; margin:0 auto 16px; border-radius:50%; background:#FDE8E8; border:2px solid #F5C6C6; display:flex; align-items:center; justify-content:center; animation:ringPop .4s cubic-bezier(.16,1,.3,1) .05s both; }
    .icon-x { width:28px; height:28px; stroke:#C62828; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:30; stroke-dashoffset:30; animation:drawX .35s ease-out .2s forwards; }
    .modal__title { font-size:18px; font-weight:700; color:#B71C1C; letter-spacing:-.02em; margin-bottom:4px; animation:fadeUp .35s ease-out .1s both; }
    .modal__sub { font-size:13px; font-weight:500; color:#6B7280; margin-bottom:20px; animation:fadeUp .35s ease-out .15s both; }
    .modal__sub strong { color:#B71C1C; font-weight:600; }
    .badge-wrap { display:flex; justify-content:center; margin-bottom:20px; animation:fadeUp .35s ease-out .18s both; }
    .badge { display:inline-flex; align-items:center; gap:5px; padding:4px 14px; border-radius:20px; font-size:12px; font-weight:700; background:#FDE8E8; color:#C62828; border:1px solid #F5C6C6; }
    .error-card { background:#FEF2F2; border:1.5px solid #F5C6C6; border-radius:10px; padding:14px 16px; margin-bottom:20px; text-align:left; animation:fadeUp .35s ease-out .2s both; }
    .error-msg { font-size:13px; font-weight:500; color:#B71C1C; line-height:1.5; }
    .error-msg code { display:inline-block; background:#FDE8E8; border-radius:4px; padding:1px 6px; font-size:12px; font-family:'JetBrains Mono','Fira Code',monospace; margin-top:6px; }
    .actions { display:flex; flex-direction:column; gap:8px; animation:fadeUp .35s ease-out .25s both; }
    .btn { display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 20px; border-radius:9px; font-size:13px; font-weight:600; font-family:inherit; border:none; cursor:pointer; transition:all .15s ease; }
    .btn--primary { background:#B71C1C; color:#FFF; box-shadow:0 2px 8px rgba(183,28,28,.15); }
    .btn--primary:hover { background:#D32F2F; box-shadow:0 4px 14px rgba(183,28,28,.22); transform:translateY(-1px); }
    .btn--primary:active { transform:translateY(0); }
    .btn--ghost { background:transparent; color:#6B7280; border:1px solid #E0E3E7; }
    .btn--ghost:hover { background:#F8F9FC; color:#B71C1C; border-color:#C5C9D0; }
    @keyframes modalIn { from{opacity:0;transform:scale(.95) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
    @keyframes ringPop { from{opacity:0;transform:scale(.5)} to{opacity:1;transform:scale(1)} }
    @keyframes drawX { to{stroke-dashoffset:0} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="accent-bar"></div>
    <div class="modal__inner">
      <div class="icon-large">
        <svg class="icon-x" viewBox="0 0 24 24">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </div>
      <h2 class="modal__title">Generate Failed</h2>
      <p class="modal__sub"><strong>INV-2026-0042</strong> &middot; PDF could not be created</p>
      <div class="badge-wrap">
        <span class="badge">
          <svg width="11" height="11" viewBox="0 0 10 10" fill="none"><circle cx="5" cy="5" r="4" stroke="currentColor" stroke-width="1.2"/><path d="M5 3v2.5M5 7h.005" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Error
        </span>
      </div>
      <div class="error-card">
        <div class="error-msg">
          Template rendering timed out. The server took too long to process the request.
          <code>HTTP 504 — Gateway Timeout</code>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn--primary">Retry</button>
        <button class="btn btn--ghost">Cancel</button>
      </div>
    </div>
  </div>
</body>
</html>
