<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Management — Mock</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,650;14..32,700;14..32,800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F5F7;
  --surface:#FFF;
  --border:#DFE1E6;
  --border-soft:#EBECF0;
  --text:#172B4D;
  --text-2:#6B778C;
  --text-3:#959DA8;
  --blue:#0C66E4;
  --blue-dark:#0747A6;
  --blue-bg:#E9F2FF;
  --blue-rgb:12,102,228;
  --green:#05905E;
  --green-bg:#E4F7EF;
  --red:#D92D3A;
  --red-bg:#FDEBED;
  --amber:#B8770A;
  --amber-bg:#FEF6E6;
  --teal:#0B8E82;
  --teal-bg:#E8F8F6;
  --purple:#6638C0;
  --purple-bg:#F0EAFB;
  --orange:#B85A0A;
  --orange-bg:#FEF2E8;
}
body{background:var(--bg);min-height:100vh;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text)}

/* ── TOPNAV (standardized) ── */
.topnav{height:52px;background:#0747A6;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100}
.topnav-l{display:flex;align-items:center;gap:10px}
.tdots{display:flex;gap:5px;align-items:center}
.td{width:10px;height:10px;border-radius:50%;display:inline-block}
.td.r{background:#ff5f56}
.td.y{background:#ffbd2e}
.td.g{background:#27c93f}
.bc{color:rgba(255,255,255,.6);font-size:13px}
.bc.active{color:#fff;font-weight:600}
.bc-sep{color:rgba(255,255,255,.4);font-size:13px}
.topnav-r{display:flex;align-items:center;gap:10px}
.topnav-link{color:#fff;text-decoration:none;font-size:12px;font-weight:600;padding:6px 12px;border-radius:6px;background:rgba(255,255,255,.12);transition:background .15s}
.topnav-link:hover{background:rgba(255,255,255,.18)}
.topnav-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:rgba(255,255,255,.15)}

/* ── PAGE ── */
.page{padding:24px 28px;max-width:1440px;margin:0 auto}
.page-hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.page-hdr .icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page-hdr .ht{flex:1}
.page-hdr .ht h1{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-.01em;margin:0}
.page-hdr .ht h1 .badge{font-size:10px;font-weight:600;padding:2px 10px;background:var(--blue-bg);color:var(--blue);letter-spacing:.02em;margin-left:10px;vertical-align:middle}
.page-hdr .ht p{font-size:14px;color:var(--text-2);margin:3px 0 0;font-weight:450}
.page-hdr-actions{display:flex;align-items:center;gap:8px}
.btn-outline{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:7px 14px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;transition:all .12s;font-family:inherit;text-decoration:none}
.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-primary{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:7px 16px;background:var(--blue);color:#fff;border:none;cursor:pointer;transition:background .15s;font-family:inherit;text-decoration:none}
.btn-primary:hover{background:var(--blue-dark)}

/* ── QUICK FILTERS ── */
.quick-filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.qf-item{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all .12s;border:1px solid var(--border);background:var(--surface);user-select:none}
.qf-item:hover{border-color:var(--blue);color:var(--blue)}
.qf-item.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.qf-item .count{font-size:10.5px;font-weight:700;padding:0 7px;background:var(--bg);height:20px;display:flex;align-items:center}
.qf-item.active .count{background:rgba(255,255,255,.18);color:#fff}

/* ── SEARCH BAR ── */
.search-bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.search-input{flex:1;max-width:400px;height:38px;padding:0 14px;border:1px solid var(--border);font-size:13px;color:var(--text);background:#fff;font-family:inherit;outline:none;transition:border .12s}
.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(var(--blue-rgb),.08)}
.search-input::placeholder{color:var(--text-3)}

/* ── CARDS ── */
.card-wrap{background:var(--surface);border:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px;padding:20px}
.nc{background:var(--surface);border:1px solid var(--border);transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column}
.nc:hover{border-color:var(--blue);box-shadow:0 4px 16px rgba(0,0,0,.04)}
.nc-hdr{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-soft)}
.nc-id{font-size:13px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:8px}
.nc-id .av-s{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0}
.nc-status{font-size:10.5px;font-weight:600;padding:4px 12px;letter-spacing:.02em}
.nc-status.active{background:var(--green-bg);color:var(--green)}
.nc-status.draft{background:var(--amber-bg);color:var(--amber)}
.nc-status.completed{background:var(--blue-bg);color:var(--blue)}
.nc-status.sent{background:var(--purple-bg);color:var(--purple)}

/* ── BODY ── */
.nc-body{padding:14px 18px;flex:1;display:flex;flex-direction:column;gap:12px}
.nc-banner-preview{width:100%;height:80px;background:var(--bg);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-2);overflow:hidden;position:relative}
.nc-banner-preview img{width:100%;height:100%;object-fit:cover}
.nc-banner-preview .placeholder{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-3);font-size:11px}
.nc-message{font-size:12.5px;color:var(--text-2);line-height:1.6;padding:10px 12px;background:var(--bg);border-left:3px solid var(--blue);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── PRODUCT MINI GRID ── */
.nc-products{display:flex;flex-direction:column;gap:8px}
.nc-products .plabel{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.nc-product-mini{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border:1px solid var(--border-soft)}
.nc-product-mini img{width:36px;height:28px;object-fit:cover;border:1px solid var(--border-soft);flex-shrink:0;background:#fff}
.nc-product-mini .pm-info{flex:1;min-width:0}
.nc-product-mini .pm-info .pm-name{font-size:12px;font-weight:600;color:var(--text)}
.nc-product-mini .pm-info .pm-price{font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.nc-product-mini .pm-info .pm-price .orig{text-decoration:line-through;color:var(--text-3)}
.nc-product-mini .pm-info .pm-price .disc{color:var(--green);font-weight:600}
.more-cars{font-size:11px;font-weight:600;color:var(--blue);padding:6px 10px;background:var(--blue-bg);display:inline-flex;align-items:center;gap:5px;align-self:flex-start;cursor:pointer}

/* ── FOOTER ── */
.nc-foot{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border-soft);background:var(--bg)}
.nc-foot .nc-date{font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.nc-foot-actions{display:flex;gap:6px}
.nc-foot-btn{width:30px;height:30px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-2);transition:all .12s;font-family:inherit}
.nc-foot-btn:hover{border-color:var(--blue);color:var(--blue)}
.nc-foot-btn.danger:hover{border-color:var(--red);color:var(--red)}

/* ── AVATARS ── */
.ac{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;flex-shrink:0}
.av-lg{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.ac.a{background:#1A56DB}.ac.b{background:#6638C0}.ac.c{background:#05905E}
.ac.d{background:#D92D3A}.ac.e{background:#B8770A}.ac.f{background:#0B8E82}
.ac.g{background:#4338CA}.ac.h{background:#C1223A}.ac.i{background:#B85A0A}
.ac.j{background:#6366F1}.ac.k{background:#0A7490}.ac.l{background:#9333EA}
.ac.m{background:#BE185D}.ac.n{background:#B85A0A}.ac.o{background:#2563EB}
.ac.p{background:#16A34A}.ac.q{background:#D92D3A}.ac.r{background:#0891B2}
.ac.s{background:#15803D}.ac.t{background:#6D28D9}.ac.u{background:#DC2626}
.ac.v{background:#0A7490}.ac.w{background:#BE185D}.ac.x{background:#4F46E5}
.ac.y{background:#65A30D}.ac.z{background:#B8770A}

/* ── PAGINATION ── */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-top:1px solid var(--border);background:var(--bg)}
.pg-info{font-size:12.5px;color:var(--text-2)}
.pg-right{display:flex;align-items:center;gap:14px}
.pg-size{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2)}
.pg-size select{height:28px;padding:0 8px;border:1px solid var(--border);font-size:11.5px;font-weight:500;color:var(--text);background:#fff;cursor:pointer;font-family:inherit;outline:none}
.pg-pages{display:flex;gap:3px}
.pg-pages button{width:30px;height:30px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:all .08s;font-weight:500}
.pg-pages button:hover{background:var(--bg);border-color:var(--text-3)}
.pg-pages button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.pg-pages button.flat{border:none;background:none;pointer-events:none}
.pg-pages button.disabled{opacity:.3;pointer-events:none}
.pg-arrow{font-size:15px!important}

/* ── EMPTY STATE ── */
.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--text-2)}
.empty strong{color:var(--text);font-size:15px}
.empty div{margin-top:6px;font-size:13px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 20px;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);width:100%;max-width:760px;position:relative;margin:auto}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border-soft)}
.modal-hdr-l{display:flex;align-items:center;gap:14px}
.modal-hdr-l .mh-t .mh-id{font-size:16px;font-weight:700;color:var(--text)}
.modal-hdr-l .mh-t .mh-sub{font-size:12px;color:var(--text-2);margin-top:2px;display:flex;align-items:center;gap:8px}
.modal-close{width:34px;height:34px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-2);transition:all .12s;font-family:inherit}
.modal-close:hover{border-color:var(--red);color:var(--red)}
.modal-body{padding:24px}
.mb-section{margin-bottom:24px}
.mb-section:last-child{margin-bottom:0}
.mb-label{font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.mb-label::after{content:'';flex:1;height:1px;background:var(--border-soft)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{display:flex;flex-direction:column;gap:3px;padding:10px 12px;background:var(--bg)}
.info-item .l{font-size:10px;font-weight:600;color:var(--text-3);letter-spacing:.03em}
.info-item .v{font-size:13px;font-weight:600;color:var(--text)}
.modal-prods{display:flex;flex-direction:column;gap:8px}
.modal-prod{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--bg)}
.modal-prod img{width:56px;height:40px;object-fit:cover;border:1px solid var(--border-soft);background:#fff;flex-shrink:0}
.modal-prod .mp-info{flex:1}
.modal-prod .mp-info .mp-name{font-size:13px;font-weight:600;color:var(--text)}
.modal-prod .mp-info .mp-meta{font-size:11px;color:var(--text-2);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.modal-prod .mp-price{text-align:right}
.modal-prod .mp-price .mp-disc{font-size:14px;font-weight:700;color:var(--green)}
.modal-prod .mp-price .mp-orig{font-size:11px;color:var(--text-3);text-decoration:line-through}
.modal-msg-preview{font-size:13px;color:var(--text-2);line-height:1.7;padding:14px 16px;background:var(--bg);border-left:3px solid var(--blue)}
.modal-banner-preview{width:100%;max-height:160px;background:var(--bg);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.modal-banner-preview img{width:100%;height:auto;object-fit:cover}
.modal-banner-preview .placeholder{display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px;color:var(--text-3);font-size:12px}
.mb-actions{display:flex;gap:10px;padding:20px 24px;border-top:1px solid var(--border-soft);justify-content:flex-end;background:var(--bg)}
.btn-secondary{height:38px;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;padding:0 18px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;transition:all .12s;font-family:inherit;text-decoration:none}
.btn-secondary:hover{border-color:var(--blue);color:var(--blue)}

/* ── TOOLTIP COUNTS ── */
.tt{position:relative;cursor:pointer}
.tt:hover .tt-b{opacity:1;visibility:visible}
.tt-b{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#172B4D;color:#fff;font-size:10px;font-weight:500;padding:4px 10px;white-space:nowrap;pointer-events:none;opacity:0;visibility:hidden;transition:all .12s;z-index:10}

/* ── RESPONSIVE ── */
@media(max-width:860px){.page{padding:24px 18px 48px}.grid{grid-template-columns:1fr}}
</style>
</head>

      { brand: 'Toyota', model: 'Camry', id: 2650, img: '', tradePrice: 18900, discountedPrice: 17500, fuelType: 'Petrol', transmission: 'Automatic' },
      { brand: 'Honda', model: 'Accord', id: 2712, img: '', tradePrice: 16500, discountedPrice: 15500, fuelType: 'Petrol', transmission: 'CVT' },
    ]
  },
  {
    id: 106, campaignBannerId: 'CAMP-2026-006', name: 'Year-End Clearance',
    description: 'Our biggest sale of the year is here! Massive discounts on 2025 models. Limited stock available.',
    createdDateTime: '20 Jun 2026', status: 'sent', statusL: 'Sent',
    isSendToAll: true, sendUserList: [],
    totalCars: 10,
    bannerImg: '',
    products: [
      { brand: 'Audi', model: 'A6', id: 3250, img: '', tradePrice: 28900, discountedPrice: 25900, fuelType: 'Diesel', transmission: 'Automatic' },
      { brand: 'BMW', model: '3 Series', id: 3380, img: '', tradePrice: 24900, discountedPrice: 22900, fuelType: 'Petrol', transmission: 'Automatic' },

const initials = s => s ? s.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) : 'NA';
const avatarClass = s => { const map='abcdefghijklmnopqrstuvwxyz'; return map[(s||'A').charCodeAt(0)%26]||'a'; };
const fmtCurrency = n => '$' + Number(n).toLocaleString();
const discountPct = (disc, trade) => Math.round(100 - (disc/trade)*100);

const brandColors = {
  'Toyota':'#DC2626','BMW':'#2563EB','Mercedes-Benz':'#05905E','Audi':'#6638C0','Lexus':'#B8770A',
  'Range Rover':'#0B8E82','Honda':'#BE185D','Porsche':'#4338CA'
};

const brandIcons = {
  'Toyota':'🚗','BMW':'🚙','Mercedes-Benz':'🏎️','Audi':'🚗','Lexus':'🚘',
  'Range Rover':'🛻','Honda':'🚙','Porsche':'🏁'
};

const brandColor = b => brandColors[b] || '#2563EB';

let modalDataIndex = 0;

campaigns.forEach((item, idx) => {
  const grid = document.getElementById('cardGrid');
  const card = document.createElement('div');
  card.className = 'nc';
  const firstProd = item.products[0];
  const remainingCount = item.totalCars - item.products.length;

  card.innerHTML = `
    <div class="nc-hdr">
      <div class="nc-id">
        <span class="av-s ac ${avatarClass(item.name)}">${initials(item.name)}</span>
        ${item.campaignBannerId}
      </div>
      <div class="nc-status ${item.status}">${item.statusL}</div>
    </div>
    <div class="nc-body">
      <div class="nc-banner-preview">
        <div class="placeholder">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          Campaign Banner
        </div>
      </div>
      <div class="nc-message">${item.description}</div>
      <div class="nc-products">
        <div class="plabel">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          Products (${item.totalCars})
        </div>
        ${item.products.map((p,pi) => `
          <div class="nc-product-mini">
            <div style="width:36px;height:28px;background:${brandColor(p.brand)}22;border:1px solid ${brandColor(p.brand)}44;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px">${brandIcons[p.brand]||'🚗'}</div>
            <div class="pm-info">
              <div class="pm-name">${p.brand} ${p.model}</div>
              <div class="pm-price"><span class="orig">${fmtCurrency(p.tradePrice)}</span> <span class="disc">${fmtCurrency(p.discountedPrice)}</span> <span style="font-size:10px;font-weight:700;color:var(--green);background:var(--green-bg);padding:0 5px;">-${discountPct(p.discountedPrice,p.tradePrice)}%</span></div>
            </div>
          </div>
        `).join('')}
        ${remainingCount > 0 ? `<span class="more-cars">+${remainingCount} more car${remainingCount>1?'s':''} <span style="font-size:10px">→</span></span>` : ''}
      </div>
    </div>
    <div class="nc-foot">
      <div class="nc-date">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        ${item.createdDateTime}
        ${item.isSendToAll ? '<span style="color:var(--blue);font-size:10px;font-weight:600;background:var(--blue-bg);padding:1px 6px;">All Users</span>' : `<span style="color:var(--purple);font-size:10px;font-weight:600;background:var(--purple-bg);padding:1px 6px;">${item.sendUserList.length} users</span>`}
      </div>
      <div class="nc-foot-actions">
        <button class="nc-foot-btn tt" onclick="openModal(${idx})" title="View">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="nc-foot-btn tt" onclick="alert('Edit campaign #${item.id}')" title="Edit">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="nc-foot-btn danger tt" onclick="alert('Delete campaign #${item.id}')" title="Delete">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>
  `;
  grid.appendChild(card);
});

modalOverlay.className = 'modal-overlay';
modalOverlay.innerHTML = `
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-hdr-l">
        <div class="mh-av av-lg ac a">SC</div>
        <div class="mh-t">
          <div class="mh-id" id="modalId">CAMP-2026-001</div>
          <div class="mh-sub">
            <span class="nc-status active" id="modalStatus">Active</span>
            <span style="font-weight:500;font-size:12px;" id="modalName">Summer Clearance Sale</span>
          </div>
        </div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="mb-section">
        <div class="mb-label">📋 Campaign Details</div>
        <div class="info-grid" id="modalInfo"></div>
      </div>
      <div class="mb-section">
        <div class="mb-label">📧 Email Message</div>
        <div class="modal-msg-preview" id="modalMsg">No message</div>

      <div class="mb-section">

            Campaign banner image will appear here
          </div>
        </div>
      </div>
      <div class="mb-section">
        <div class="mb-label">📦 Products in Campaign</div>
        <div class="modal-prods" id="modalProds"></div>
      </div>
    </div>
    <div class="mb-actions">
      <button class="btn-secondary" onclick="closeModal()">Close</button>
      <a href="#" class="btn-primary" style="height:38px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:7px;padding:0 20px;color:#fff;" onclick="event.preventDefault();closeModal();alert('Edit campaign')">Edit Campaign</a>
    </div>
  </div>
`;
document.body.appendChild(modalOverlay);

function openModal(idx) {
  const item = campaigns[idx];
  if (!item) return;

  document.getElementById('modalId').textContent = item.campaignBannerId;
  document.getElementById('modalStatus').textContent = item.statusL;
  document.getElementById('modalStatus').className = 'nc-status ' + item.status;
  document.getElementById('modalName').textContent = item.name;
  document.querySelector('.mh-av').className = 'mh-av av-lg ac ' + avatarClass(item.name);
  document.querySelector('.mh-av').textContent = initials(item.name);

  document.getElementById('modalInfo').innerHTML = `
    <div class="info-item" style="border-left:3px solid var(--blue);"><span class="l">🆔 Campaign ID</span><span class="v" style="color:var(--blue);font-weight:700;">${item.campaignBannerId}</span></div>
    <div class="info-item" style="border-left:3px solid var(--purple);"><span class="l">📅 Created On</span><span class="v">${item.createdDateTime}</span></div>
    <div class="info-item" style="border-left:3px solid var(--teal);"><span class="l">🚗 Total Products</span><span class="v">${item.totalCars}</span></div>
    <div class="info-item" style="border-left:3px solid var(--orange);"><span class="l">📧 Send To</span><span class="v">${item.isSendToAll ? 'All Users' : item.sendUserList.length + ' selected users'}</span></div>
  `;

  document.getElementById('modalMsg').textContent = item.description;

  document.getElementById('modalProds').innerHTML = item.products.map((p, pi) => `
    <div class="modal-prod">
      <div style="width:56px;height:40px;background:${brandColor(p.brand)}22;border:1px solid ${brandColor(p.brand)}44;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px">${brandIcons[p.brand]||'🚗'}</div>
      <div class="mp-info">
        <div class="mp-name">${p.brand} ${p.model}</div>
        <div class="mp-meta">
          <span style="color:var(--text-2);font-weight:500;">ID: PA-${p.id}</span>
          <span>⚡ ${p.fuelType}</span>
          <span>⚙️ ${p.transmission}</span>
        </div>
      </div>
      <div class="mp-price">
        <div class="mp-disc">${fmtCurrency(p.discountedPrice)}</div>
        <div class="mp-orig">${fmtCurrency(p.tradePrice)}</div>
        <div style="font-size:10px;font-weight:700;color:var(--green);">-${discountPct(p.discountedPrice,p.tradePrice)}%</div>
      </div>
    </div>
  `).join('');

  modalOverlay.classList.add('open');
}

function closeModal() {
  modalOverlay.classList.remove('open');
}
</script>
