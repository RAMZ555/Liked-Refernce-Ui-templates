<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Navy Success Modal v2 — Resource Request</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Amazon Ember', 'Inter', 'Helvetica Neue', Roboto, Arial, sans-serif;
    background: #f2f3f3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #16191f;
  }

  .page-note { text-align: center; margin-bottom: 32px; max-width: 520px; }
  .page-note h1 { font-size: 20px; font-weight: 700; color: #1e3a8a; }
  .page-note p  { font-size: 13px; color: #545b64; margin-top: 8px; line-height: 1.5; }

  .preview-btn {
    background: #1e3a8a;
    border: 1px solid #1e3a8a;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease;
  }
  .preview-btn:hover { background: #172f6e; }

  /* ── Modal ── */
  .settings-modal {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: 'Amazon Ember', 'Inter', 'Helvetica Neue', Roboto, Arial, sans-serif;
  }
  .settings-modal.open { display: flex; }

  .settings-modal__scrim {
    position: absolute;
    inset: 0;
    background: rgba(23, 37, 84, 0.5);
    animation: settingsFadeIn 0.2s ease-out;
  }

  .settings-modal__box {
    position: relative;
    width: 360px;
    max-width: calc(100vw - 32px);
    background: #ffffff;
    border: 1px solid #d5dbdb;
    border-radius: 8px;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.02),
      0 24px 56px -10px rgba(23, 37, 84, 0.3);
    animation: settingsModalIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
  }

  .settings-modal__topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: #1e3a8a;
    border-bottom: 1px solid #172f6e;
  }
  .settings-modal__topbar-badge {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .settings-modal__topbar-title {
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.01em;
  }

  .settings-modal__dots {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
  }
  .settings-modal__dots .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .dot--green { background: #22c55e; }
  .dot--amber { background: #f59e0b; }
  .dot--red   { background: #ef4444; }

  .settings-modal__body { padding: 20px 24px 0; }

  .settings-modal__badge-wrap {
    margin-bottom: 16px;
    text-align: center;
    animation: settingsFadeUp 0.3s ease-out 0.08s both;
  }
  .settings-modal__badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 12px;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: #e6f6ef;
    color: #0f6b4a;
    border: 1px solid #22c55e;
  }

  .settings-modal__card {
    background: #fbfbfa;
    border: 1px solid #d5dbdb;
    border-radius: 3px;
    padding: 4px 16px;
    margin-bottom: 16px;
    text-align: left;
    animation: settingsFadeUp 0.3s ease-out 0.12s both;
  }
  .settings-modal__row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 0;
  }
  .settings-modal__row + .settings-modal__row { border-top: 1px solid #e9ebeb; }
  .settings-modal__row-label { font-size: 12px; font-weight: 500; color: #545b64; }
  .settings-modal__row-value { font-size: 13px; font-weight: 600; color: #232f3e; text-align: right; }
  .settings-modal__row-value--accent { color: #1e3a8a; font-weight: 700; }

  .settings-modal__footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 14px 24px;
    background: #fafafa;
    border-top: 1px solid #e9ebeb;
    animation: settingsFadeUp 0.3s ease-out 0.16s both;
  }
  .settings-modal__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 7px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .settings-modal__btn--primary {
    background: #1e3a8a;
    border-color: #172f6e;
    color: #ffffff;
  }
  .settings-modal__btn--primary:hover { background: #172f6e; }
  .settings-modal__btn--primary:active { transform: translateY(1px); }
  .settings-modal__btn--secondary {
    background: #ffffff;
    border-color: #879596;
    color: #16191f;
  }
  .settings-modal__btn--secondary:hover { background: #f2f3f3; border-color: #aab7b8; }

  @keyframes settingsFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes settingsModalIn {
    from { opacity: 0; transform: scale(0.97) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes settingsFadeUp {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="page-note">
    <h1>Resource Request Created — Navy v2</h1>
    <p>Subtitle removed. Click below to preview.</p>
  </div>

  <button class="preview-btn" onclick="openModal()">Preview success modal</button>

  <!-- Modal -->
  <div class="settings-modal" id="successModal">
    <div class="settings-modal__scrim" onclick="closeModal()" aria-hidden="true"></div>
    <div class="settings-modal__box" role="dialog" aria-modal="true" aria-label="Resource Request Created">
      <div class="settings-modal__topbar">
        <span class="settings-modal__topbar-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 13l4 4L19 7" stroke="#1e3a8a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span class="settings-modal__topbar-title">Resource Request Created</span>
        <div class="settings-modal__dots" aria-hidden="true">
          <span class="dot dot--green"></span>
          <span class="dot dot--amber"></span>
          <span class="dot dot--red"></span>
        </div>
      </div>

      <div class="settings-modal__body">
        <div class="settings-modal__badge-wrap">
          <span class="settings-modal__badge">Request Created</span>
        </div>

        <div class="settings-modal__card">
          <div class="settings-modal__row">
            <span class="settings-modal__row-label">Request Code</span>
            <span class="settings-modal__row-value settings-modal__row-value--accent">2026-00003</span>
          </div>
          <div class="settings-modal__row">
            <span class="settings-modal__row-label">Job Role</span>
            <span class="settings-modal__row-value">Boomi Developer</span>
          </div>
          <div class="settings-modal__row">
            <span class="settings-modal__row-label">Positions</span>
            <span class="settings-modal__row-value">3</span>
          </div>
          <div class="settings-modal__row">
            <span class="settings-modal__row-label">Country</span>
            <span class="settings-modal__row-value">India</span>
          </div>
        </div>
      </div>

      <div class="settings-modal__footer">
        <button type="button" class="settings-modal__btn settings-modal__btn--secondary" onclick="closeModal()">
          Close
        </button>
        <button type="button" class="settings-modal__btn settings-modal__btn--primary" onclick="closeModal()">
          View Requests
        </button>
      </div>
    </div>
  </div>

<script>
  const modal = document.getElementById('successModal');

  function openModal()  { modal.classList.add('open'); }
  function closeModal() { modal.classList.remove('open'); }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
</script>

</body>
</html>
